# =============================================================================
# Local Development Overrides (자동 로드)
# =============================================================================
# docker compose up 실행 시 자동으로 병합됨
# - 로컬 PostgreSQL 15 인스턴스 추가 (운영 Supabase 와 같은 메이저, timescaledb 없음)
# - consumer가 로컬 db에 연결하도록 설정
# =============================================================================

services:
  db:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  stats-refresh-consumer:
    env_file:
      - .env
    environment:
      # 로컬에서는 docker 내부 db 컨테이너에 연결
      POSTGRES_HOST: db
      SENTRY_ENVIRONMENT: local
    depends_on:
      - db
