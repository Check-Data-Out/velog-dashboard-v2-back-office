name: Daily Stats Batch (set20)

on:
  workflow_dispatch:
    inputs:
      min_group:
        description: 'Minimum group number'
        required: true
        default: '951'
      max_group:
        description: 'Maximum group number'
        required: true
        default: '1000'
  schedule:
    - cron: "*/50 * * * *"

# 같은 세트가 겹쳐 돌면 동일 (post, date) 행이 중복 생성된다.
# 수동 dispatch 와 cron 이 겹치는 상황을 막는다.
concurrency:
  group: daily-aggre-set20
  cancel-in-progress: false

jobs:
  velog-posts-daily-stats-batch:
    uses: ./.github/workflows/daily-aggre-batch.yaml
    with:
      set_label: SET20
      min_group: ${{ github.event.inputs.min_group || '951' }}
      max_group: ${{ github.event.inputs.max_group || '1000' }}
    secrets: inherit
