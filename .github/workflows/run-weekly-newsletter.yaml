name: Weekly Newsletter Batch

on:
  workflow_dispatch:
  schedule:
    # 평소에는 BO 서버 crontab(run-weekly.sh)이 월요일 09:30 KST 에 돌린다.
    # 이 예약은 이번 주 발송이 끝나지 않았고 실행 중도 아닐 때만 일하는 안전망이다 (월요일 13:10 KST, 정각은 늦거나 빠지기 쉬워 피한다)
    - cron: "10 13 * * 1"
      timezone: "Asia/Seoul"

jobs:
  # 이번 주 발송이 끝났거나 실행 중이거나 먼저 뜬 run 이 돌고 있으면 본 작업을 건너뛴다 (체크아웃·secret 파일·DB 쓰기 없음)
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Decide Whether To Run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          PGUSER: ${{ secrets.POSTGRES_USER }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGDATABASE: ${{ secrets.DATABASE_NAME }}
          PGCONNECT_TIMEOUT: "15"
        run: |
          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # 늦게 뜬 예약 run 이 화요일에 돌면 다른 주차를 보낸다
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=Asia/Seoul date +%u)" != "1" ]; then
            decide false "건너뜀: 예약 run 인데 KST 월요일이 아님"
          fi

          # 먼저 만들어진 예약·수동 run 만 본다 (둘이 동시에 떠서 서로를 보고 함께 건너뛰지 않게)
          # fork PR 등 다른 이벤트 run 은 이름이 같아도 세지 않는다
          ACTIVE=$(gh api "repos/${{ github.repository }}/actions/workflows/run-weekly-newsletter.yaml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.id < '"$RUN_ID"'
              and (.event == "schedule" or .event == "workflow_dispatch")
              and (.status | test("^(queued|in_progress|waiting|pending|requested)$")))] | length')
          if [ "$ACTIVE" != "0" ]; then
            decide false "건너뜀: 먼저 만들어진 run ${ACTIVE}개가 아직 끝나지 않음"
          fi

          # 이번 주 발송이 끝났거나 60분 안에 시작했으면(아직 도는 중) 물러난다 (읽기 전용 트랜잭션)
          # 60분은 발송 시간 제한 48분에 여유를 더한 값이다. 시작했지만 끝나지 않은 채 멈춘 발송은
          # GitHub 가 이어서 보낸다. 이번 주 뉴스레터를 이미 받은 이메일은 파이썬이 뺀다
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          # psql 오류 원문에는 DB 주소가 들어갈 수 있어 공개 로그에 남기지 않는다
          if ! FOUND=$(psql -X -q -A -t -v ON_ERROR_STOP=1 -c 'BEGIN READ ONLY' \
            -c "SELECT count(*) FROM insight_weeklytrend WHERE week_end_date >= (date_trunc('week', now() AT TIME ZONE 'Asia/Seoul')::date - 1) AND (is_processed OR (insight->'_batch'->>'newsletter_started_at')::timestamptz > now() - interval '60 minutes')" \
            -c 'COMMIT' 2>/dev/null); then
            echo "DB 조회 실패 (오류 원문은 남기지 않음)" >&2
            exit 1
          fi
          if [ "$FOUND" != "0" ]; then
            decide false "건너뜀: 이번 주 발송이 끝났거나 실행 중 (${FOUND}건)"
          fi

          decide true "실행: 이번 주 발송이 끝나지 않았고 실행 중도 아님"

      # 판정이 실패하면 본 작업이 skipped 라 본 작업 Slack 도 가지 않으므로 여기서 알린다
      - name: Send Slack Notification On Guard Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": ${{ toJSON(format('❌ *Weekly Newsletter Batch* 안전망 판정 실패 <{0}/{1}/actions/runs/{2}|View Workflow>', github.server_url, github.repository, github.run_id)) }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  weekly-newsletter-batch:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 1.8.4

      - name: Setup a local virtual environment
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Define a cache for the virtual environment
        uses: actions/cache@v6
        with:
          path: ./.venv
          key: venv2-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry env use "${{ steps.setup-python.outputs.python-path }}"
          poetry install --with dev

      - name: Create .env.prod file
        # 서명 키는 셸이 $·백틱을 해석하지 않도록 env 로 넘겨 그대로 기록한다
        env:
          NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env.prod
          echo "DEBUG=False" >> .env.prod
          echo "DATABASE_ENGINE=${{ secrets.DATABASE_ENGINE }}" >> .env.prod
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env.prod
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.prod
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.prod
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env.prod
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env.prod
          echo "AES_KEY_0=${{ secrets.AES_KEY_0 }}" >> .env.prod
          echo "AES_KEY_1=${{ secrets.AES_KEY_1 }}" >> .env.prod
          echo "AES_KEY_2=${{ secrets.AES_KEY_2 }}" >> .env.prod
          echo "AES_KEY_3=${{ secrets.AES_KEY_3 }}" >> .env.prod
          echo "AES_KEY_4=${{ secrets.AES_KEY_4 }}" >> .env.prod
          echo "AES_KEY_5=${{ secrets.AES_KEY_5 }}" >> .env.prod
          echo "AES_KEY_6=${{ secrets.AES_KEY_6 }}" >> .env.prod
          echo "AES_KEY_7=${{ secrets.AES_KEY_7 }}" >> .env.prod
          echo "AES_KEY_8=${{ secrets.AES_KEY_8 }}" >> .env.prod
          echo "AES_KEY_9=${{ secrets.AES_KEY_9 }}" >> .env.prod
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.prod
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.prod
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env.prod
          echo "DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}" >> .env.prod
          printf 'NEWSLETTER_UNSUBSCRIBE_SECRET=%s\n' "$NEWSLETTER_UNSUBSCRIBE_SECRET" >> .env.prod
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env.prod
          echo "SENTRY_TRACES_SAMPLE_RATE=0.2" >> .env.prod

      - name: Run Weekly Newsletter Batch Script
        id: weekly-newsletter-main
        timeout-minutes: 48
        env:
          DJANGO_SETTINGS_MODULE: backoffice.settings.prod
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -e
          poetry run python ./insight/tasks/weekly_newsletter_batch.py

      # KST 시간을 GitHub Actions 환경 변수에 세팅
      - name: Get Current KST Time
        if: always()
        run: echo "KST_TIME=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 결과 파일을 읽어 Slack 메시지를 셸에서 안전하게 조립한다.
      # (임의 문자가 payload JSON 을 깨뜨리지 않도록 toJSON 으로 escape)
      - name: Compose Slack Message
        if: always()
        id: compose
        env:
          JOB_STATUS: ${{ job.status }}
          KST_TIME: ${{ env.KST_TIME }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 할 일 없이 성공으로 끝났으면 알리지 않는다
          if [ "$JOB_STATUS" = "success" ] && [ -e weekly_newsletter_batch.skipped ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          RESULT=$(cat newsletter_batch_result.txt 2>/dev/null || echo "No output file found")
          if [ "$JOB_STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          # delimiter 가 RESULT 값에 한 줄로 등장해 출력이 잘리는 일을 막기 위해 매 실행 유니크 delimiter 사용
          DELIM="SLACK_EOF_$(openssl rand -hex 16)"
          {
            echo "TEXT<<$DELIM"
            printf '⚠️ GitHub 안전망 실행 — 이번 주 발송이 끝나지 않았고 실행 중도 아니었음\n'
            printf '*Weekly Newsletter Batch*\n\n'
            printf '%s *Status:* %s\n' "$ICON" "$JOB_STATUS"
            printf '📅 *Timestamp (KST):* %s\n' "$KST_TIME"
            printf '📝 *Result:*\n```\n%s\n```\n' "$RESULT"
            printf '🔗 *Workflow URL:* <%s|View Workflow>\n' "$RUN_URL"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # toJSON 으로 escape — payload JSON 이 절대 깨지지 않는다 (성공/실패 공통)
      - name: Send Slack Notification
        if: always() && steps.compose.outputs.skip != 'true'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": ${{ toJSON(steps.compose.outputs.TEXT) }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
